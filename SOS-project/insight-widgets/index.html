<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoS Insight Widget Pack</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Rajdhani:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <div class="header-titles">
                <h1>SoS <span class="glow-text">Insight</span></h1>
                <p class="subtitle">Next-Generation Engineering Console</p>
            </div>
            <div class="system-status">
                <span class="status-dot"></span>
                <span>SYSTEM ONLINE</span>
            </div>
        </header>

        <main class="widget-grid">
            <!-- Widget 1: Core Processing AI Compute -->
            <div class="widget">
                <div class="widget-header">
                    <h2>Neural Core Processing</h2>
                    <span class="widget-icon">⎈</span>
                </div>
                <div class="widget-content core-processing">
                    <div class="reactor-core">
                        <div class="ring ring-1"></div>
                        <div class="ring ring-2"></div>
                        <div class="ring ring-3"></div>
                        <div class="core-value" id="core-compute-val">87%</div>
                    </div>
                    <div class="data-readout">
                        <div class="readout-item">
                            <span class="label">THREADS</span>
                            <span class="value" id="thread-count">1,024</span>
                        </div>
                        <div class="readout-item">
                            <span class="label">LATENCY</span>
                            <span class="value" id="latency-val">12ms</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Widget 2: Token Flow Velocity -->
            <div class="widget">
                <div class="widget-header">
                    <h2>Token Stream Velocity</h2>
                    <span class="widget-icon">≈</span>
                </div>
                <div class="widget-content token-flow">
                    <canvas id="token-chart"></canvas>
                    <div class="flow-stats">
                        <div class="stat">
                            <span class="stat-value" id="tokens-sec">4,892</span>
                            <span class="stat-label">TOKENS/s</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Widget 3: Node Connectivity Matrix -->
            <div class="widget widget-large">
                <div class="widget-header">
                    <h2>Global Node Matrix</h2>
                    <span class="widget-icon">⚄</span>
                </div>
                <div class="widget-content node-matrix" id="node-matrix-container">
                    <!-- JS will inject nodes here -->
                </div>
            </div>

            <!-- Widget 4: Active Threat Scan -->
            <div class="widget">
                <div class="widget-header">
                    <h2>Anomaly Scanner</h2>
                    <span class="widget-icon">◎</span>
                </div>
                <div class="widget-content scanner-widget">
                    <div class="radar-container">
                        <div class="radar-scan"></div>
                        <div class="target-blips" id="radar-blips"></div>
                    </div>
                    <div class="scan-log" id="scan-log">
                        <!-- JS logs -->
                    </div>
                </div>
            </div>

            <!-- Widget 5: Cybernetic Activity Log -->
            <div class="widget">
                <div class="widget-header">
                    <h2>Operation Log</h2>
                    <span class="widget-icon">☰</span>
                </div>
                <div class="widget-content operation-log">
                    <div class="cyber-stream" id="cyber-stream">
                        <!-- JS stream -->
                    </div>
                </div>
            </div>

        </main>
    </div>
    <script src="script.js"></script>
</body>

</html>
